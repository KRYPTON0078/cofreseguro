apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cofreseguro.fullname" . }}
  labels:
    app.kubernetes.io/name: cofreseguro
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cofreseguro
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cofreseguro
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ENVIRONMENT
              value: {{ .Values.env.ENVIRONMENT | quote }}
            - name: OLLAMA_ENABLED
              value: {{ .Values.env.OLLAMA_ENABLED | quote }}
            - name: DATABASE_URL
              value: {{ .Values.env.DATABASE_URL | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cofreseguro.fullname" . }}-secrets
                  key: jwtSecret
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "cofreseguro.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
