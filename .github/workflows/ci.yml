name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest tests/ -q --cov=cofreseguro --cov-fail-under=70

  flutter-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-web:
    runs-on: ubuntu-latest
    needs: flutter-analyze
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --dart-define=API_BASE=http://localhost:8080
      - uses: actions/upload-artifact@v4
        with:
          name: cofreseguro-web
          path: mobile/build/web

  build-apk:
    runs-on: ubuntu-latest
    needs: flutter-analyze
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_BASE=http://10.0.2.2:8080
      - uses: actions/upload-artifact@v4
        with:
          name: cofreseguro-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk

  build-windows:
    runs-on: windows-latest
    needs: flutter-analyze
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=API_BASE=http://127.0.0.1:8080
      - uses: actions/upload-artifact@v4
        with:
          name: cofreseguro-windows
          path: mobile/build/windows/x64/runner/Release
